name: Build NavBand APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare permanent APK signing key
        shell: bash
        env:
          NAVBAND_KEYSTORE_BASE64: ${{ secrets.NAVBAND_KEYSTORE_BASE64 }}
          NAVBAND_KEYSTORE_PASSWORD: ${{ secrets.NAVBAND_KEYSTORE_PASSWORD }}
          NAVBAND_KEY_ALIAS: ${{ secrets.NAVBAND_KEY_ALIAS }}
          NAVBAND_KEY_PASSWORD: ${{ secrets.NAVBAND_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in NAVBAND_KEYSTORE_BASE64 NAVBAND_KEYSTORE_PASSWORD NAVBAND_KEY_ALIAS NAVBAND_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Actions secret $name is missing. Configure the permanent NavBand signing key first."
              exit 1
            fi
          done

          echo "$NAVBAND_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/navband-release.jks"
          test -s "$RUNNER_TEMP/navband-release.jks"
          echo "NAVBAND_KEYSTORE_PATH=$RUNNER_TEMP/navband-release.jks" >> "$GITHUB_ENV"
          echo "NAVBAND_KEYSTORE_PASSWORD=$NAVBAND_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NAVBAND_KEY_ALIAS=$NAVBAND_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NAVBAND_KEY_PASSWORD=$NAVBAND_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Setup Android SDK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager non trovato: $SDKMANAGER"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

          echo "Android SDK verificato:"
          "$ANDROID_HOME/platform-tools/adb" --version
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" version

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build signed debug APK
        working-directory: NavBand
        run: gradle assembleDebug --stacktrace -PNAVBAND_VERSION_CODE=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NavBand-debug
          path: NavBand/app/build/outputs/apk/debug/app-debug.apk
